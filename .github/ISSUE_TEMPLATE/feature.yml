name: Feature suggestion
description: Suggest a targeted improvement
title: "[Idea]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior and acceptance criteria
    validations:
      required: true
  - type: textarea
    id: cost
    attributes:
      label: Trade-offs and potential usage overhead
